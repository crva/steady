name: Steady

options:
  bundleIdPrefix: com.crva
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Steady:
    type: application
    platform: iOS
    sources:
      - path: Steady
        excludes:
          - "Resources/Steady.storekit"
      - path: Steady/Resources/Steady.storekit
        buildPhase: none
      - path: Shared
    info:
      path: Steady/Info.plist
      properties:
        CFBundleDisplayName: Steady
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.crva.steady
            CFBundleURLSchemes: [steady]
    entitlements:
      path: Steady/Steady.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crva.steady
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.crva.steady
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crva.steady
        PRODUCT_NAME: Steady
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Dark AppIcon-Teal AppIcon-Coral AppIcon-Indigo
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
    dependencies:
      - target: SteadyWidgets

  SteadyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SteadyWidgets
      - path: Shared
    info:
      path: SteadyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Steady
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SteadyWidgets/SteadyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.crva.steady
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crva.steady.widgets
        PRODUCT_NAME: SteadyWidgets
        SKIP_INSTALL: YES

  SteadyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SteadyTests
    dependencies:
      - target: Steady
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crva.steady.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Steady:
    build:
      targets:
        Steady: all
    test:
      gatherCoverageData: true
      targets:
        - SteadyTests
    run:
      config: Debug
      storeKitConfiguration: Steady/Resources/Steady.storekit
    archive:
      config: Release
